<!-- User Message Bubble Component -->
<div class="flex justify-end mb-4" id="msg-{{ msg.id }}">
    <div class="max-w-[85%] md:max-w-[75%] bg-blue-600 rounded-2xl rounded-tr-sm p-4 shadow-lg">
        <!-- Header with timestamp and actions -->
        <div class="flex items-center justify-between mb-2 text-xs opacity-70">
            <span class="font-medium">You • {{ msg.created_at | from_iso | wib }}</span>
            <div class="flex gap-2 ml-2">
                <!-- Edit button -->
                <button hx-get="/chat/message/{{ msg.id }}/edit"
                        hx-target="#msg-{{ msg.id }}"
                        hx-swap="outerHTML"
                        class="hover:text-white transition-colors p-1" 
                        title="Edit message">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                    </svg>
                </button>
                <!-- Copy button -->
                <button onclick="copyToClipboard(`{{ msg.content | e }}`, this)"
                        class="hover:text-white transition-colors p-1" 
                        title="Copy message">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
                    </svg>
                </button>
            </div>
        </div>
        
        <!-- Message Content -->
        <div class="whitespace-pre-wrap leading-relaxed">{{ msg.content }}</div>
        
        <!-- Edited indicator -->
        {% if msg.is_edited %}
            <div class="text-xs opacity-50 mt-2 italic flex items-center gap-1">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
                edited {{ msg.edited_at | from_iso | wib }}
            </div>
        {% endif %}
    </div>
</div>
