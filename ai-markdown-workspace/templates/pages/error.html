<!-- Error Page Template -->
{% extends "base.html" %}

{% block content %}
<div class="flex items-center justify-center min-h-[60vh]">
    <div class="text-center max-w-2xl px-4">
        <h1 class="text-6xl font-bold text-red-500 mb-4">{{ status_code or 500 }}</h1>
        <h2 class="text-2xl font-semibold mb-4">{{ title or 'Internal Server Error' }}</h2>
        <p class="text-gray-400 mb-8">{{ message or 'Something went wrong. Please try again.' }}</p>
        
        {% if detail and debug %}
        <div class="bg-gray-800 rounded-lg p-4 text-left mb-6 overflow-auto max-h-96">
            <pre class="text-sm text-red-400">{{ detail }}</pre>
        </div>
        {% endif %}
        
        <div class="flex gap-4 justify-center">
            <a href="/chat" 
               hx-get="/chat"
               hx-target="#main-content"
               hx-push-url="true"
               class="bg-blue-600 hover:bg-blue-700 px-6 py-3 rounded-lg font-medium transition-colors">
                ← Back to Chat
            </a>
            <button onclick="window.location.reload()"
                    class="bg-gray-700 hover:bg-gray-600 px-6 py-3 rounded-lg font-medium transition-colors">
                🔄 Reload Page
            </button>
        </div>
    </div>
</div>
{% endblock %}
