<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI Markdown Workspace{% endblock %}</title>
    
    <!-- Tailwind CSS (CDN for development) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gray: {
                            750: '#2d3748',
                            850: '#1a202c',
                            950: '#0d1117',
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@2.0.0/dist/htmx.min.js"></script>
    <script src="https://unpkg.com/htmx.org@2.0.0/dist/ext/sse.js"></script>
    <script src="https://unpkg.com/htmx.org@2.0.0/dist/ext/json-enc.js"></script>
    
    <!-- Alpine.js -->
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/markdown.css">
    <style>
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1f2937;
        }
        ::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #6b7280;
        }
        
        /* HTMX indicator */
        .htmx-indicator {
            display: none;
        }
        .htmx-request .htmx-indicator {
            display: inline-block;
        }
        .htmx-request.htmx-indicator {
            display: inline-block;
        }
        
        /* Mobile drawer transitions */
        [x-cloak] { display: none !important; }
    </style>
    
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">
    <div class="flex h-screen overflow-hidden">
        <!-- Desktop Sidebar -->
        <aside id="sidebar" 
               class="hidden md:flex md:flex-col w-64 bg-gray-800 border-r border-gray-700 flex-shrink-0">
            {% include 'components/sidebar.html' %}
        </aside>
        
        <!-- Main Content Area -->
        <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
            <!-- Topbar -->
            {% include 'components/topbar.html' %}
            
            <!-- Page Content -->
            <main id="main-content" class="flex-1 overflow-y-auto p-4 md:p-6">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>
    
    <!-- Mobile Drawer (Hamburger Menu) -->
    <div x-data="{ open: false }" x-cloak>
        <!-- Backdrop -->
        <div x-show="open" 
             x-transition:enter="transition-opacity ease-linear duration-300"
             x-transition:enter-start="opacity-0"
             x-transition:enter-end="opacity-100"
             x-transition:leave="transition-opacity ease-linear duration-300"
             x-transition:leave-start="opacity-100"
             x-transition:leave-end="opacity-0"
             class="md:hidden fixed inset-0 bg-black/50 z-40"
             @click="open = false"></div>
        
        <!-- Drawer Panel -->
        <div x-show="open"
             x-transition:enter="transition ease-in-out duration-300 transform"
             x-transition:enter-start="-translate-x-full"
             x-transition:enter-end="translate-x-0"
             x-transition:leave="transition ease-in-out duration-300 transform"
             x-transition:leave-start="translate-x-0"
             x-transition:leave-end="-translate-x-full"
             class="md:hidden fixed top-0 left-0 bottom-0 w-64 bg-gray-800 z-50 overflow-y-auto">
            <div class="p-4">
                <button @click="open = false" class="mb-4 text-gray-400 hover:text-white">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
                {% include 'components/sidebar.html' %}
            </div>
        </div>
    </div>
    
    <!-- Mobile Hamburger Button -->
    <button @click="$dispatch('toggle-drawer')" 
            class="md:hidden fixed top-4 left-4 z-30 p-2 bg-gray-800 rounded-lg shadow-lg hover:bg-gray-700">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
    </button>
    
    <!-- Toast Container -->
    <div id="toast-container" class="fixed top-4 right-4 z-50 space-y-2"></div>
    
    <!-- Global Alpine Store -->
    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.store('app', {
                currentWorkspace: {{ current_workspace_id | default(1) }},
                drawerOpen: false,
            });
        });
        
        // Listen for drawer toggle
        document.addEventListener('toggle-drawer', () => {
            const event = new CustomEvent('toggle-drawer');
            window.dispatchEvent(event);
        });
        
        // Copy to clipboard function
        function copyToClipboard(text, button) {
            navigator.clipboard.writeText(text).then(() => {
                showToast('✓ Copied to clipboard!', 'success');
                if (button) {
                    const originalText = button.innerHTML;
                    button.innerHTML = '✓ Copied!';
                    setTimeout(() => {
                        button.innerHTML = originalText;
                    }, 2000);
                }
            }).catch(err => {
                showToast('✗ Failed to copy', 'error');
                console.error('Copy failed:', err);
            });
        }
        
        // Show toast notification
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            const colors = {
                success: 'bg-green-600',
                error: 'bg-red-600',
                info: 'bg-blue-600',
                warning: 'bg-yellow-600'
            };
            
            toast.className = `${colors[type]} text-white px-4 py-2 rounded-lg shadow-lg flex items-center gap-2 animate-fade-in`;
            toast.textContent = message;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
        
        // Auto-scroll chat to bottom
        function scrollToBottom() {
            const messagesList = document.getElementById('messages-list');
            if (messagesList) {
                messagesList.scrollTop = messagesList.scrollHeight;
            }
        }
        
        // Handle HTMX events
        document.body.addEventListener('htmx:afterRequest', (event) => {
            // Auto-scroll after chat message
            if (event.detail.pathInfo.path.includes('/chat/send')) {
                setTimeout(scrollToBottom, 100);
            }
        });
    </script>
    
    {% block extra_scripts %}{% endblock %}
</body>
</html>
